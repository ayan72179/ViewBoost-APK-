          cat << 'EOF' > app/src/main/java/com/fomo/earn/AutoWatchService.java
          package com.fomo.earn;

          import android.accessibilityservice.AccessibilityService;
          import android.annotation.SuppressLint;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.webkit.CookieManager;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONObject;

          import java.io.IOException;
          import java.util.concurrent.TimeUnit;

          import okhttp3.Call;
          import okhttp3.Callback;
          import okhttp3.FormBody;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;

          public class AutoWatchService extends AccessibilityService {

              private static final String YOUTUBE_PKG = "com.google.android.youtube";
              public static boolean isRunning = false;
              public static int currentUserId = 1;
              public static String currentVideoId = "";

              public static int targetDuration = 15;
              public static int currentElapsed = 0;
              public static int currentRemainingSeconds = 15;

              private boolean isPaused = false;
              private boolean isAdDetected = false;
              public static final String BASE_URL = "http://zaicash.gamer.gd";

              private static final String[] FALLBACK_VIDEOS = {
                  "kJQP7kiw5Fk", "fJ9rUzIMcZQ", "9bZkp7q19f0", "3JZ_D3ELwOQ", "OPf0YbXqDm0", "JGwWNGJdvx8"
              };
              private static int fallbackIndex = 0;

              private WindowManager windowManager;
              private View overlayView;
              private TextView tvPillSeconds;

              private Handler tickerHandler = new Handler(Looper.getMainLooper());
              private Runnable tickerRunnable;
              public static AutoWatchService instance;

              public static boolean isServiceAlive() {
                  return instance != null;
              }

              public static void startEngine(Context context, int uId) {
                  isRunning = true;
                  currentUserId = uId;
                  fetchNextAndPlay(context);
              }

              public static void stopEngine() {
                  isRunning = false;
                  currentVideoId = "";
                  if (instance != null) {
                      instance.stopWatcher();
                  }
              }

              private static void fetchNextAndPlay(Context context) {
                  try {
                      String cookie = CookieManager.getInstance().getCookie(BASE_URL);

                      Request.Builder reqBuilder = new Request.Builder()
                              .url(BASE_URL + "/index.php?api=get_video&user_id=" + currentUserId)
                              .header("User-Agent", "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36")
                              .header("Accept", "application/json");

                      if (cookie != null && !cookie.isEmpty()) {
                          reqBuilder.header("Cookie", cookie);
                      }

                      OkHttpClient client = new OkHttpClient.Builder()
                              .connectTimeout(8, TimeUnit.SECONDS)
                              .readTimeout(8, TimeUnit.SECONDS)
                              .build();

                      client.newCall(reqBuilder.build()).enqueue(new Callback() {
                          @Override
                          public void onFailure(Call call, IOException e) {
                              playFallbackVideo(context);
                          }

                          @Override
                          public void onResponse(Call call, Response response) {
                              try {
                                  String body = response.body() != null ? response.body().string() : "";
                                  JSONObject json = new JSONObject(body);

                                  if ("success".equals(json.optString("status"))) {
                                      String vid = json.optString("video_id", FALLBACK_VIDEOS[0]);
                                      targetDuration = json.optInt("duration", 15);
                                      if (targetDuration <= 0) targetDuration = 15;
                                      playVideo(context, vid);
                                  } else if ("limit_reached".equals(json.optString("status"))) {
                                      String limitMsg = json.optString("message", "No task available right now");
                                      new Handler(Looper.getMainLooper()).post(() -> {
                                          Toast.makeText(context, limitMsg, Toast.LENGTH_LONG).show();
                                      });
                                      stopEngine();
                                  } else {
                                      playFallbackVideo(context);
                                  }
                              } catch (Exception e) {
                                  playFallbackVideo(context);
                              }
                          }
                      });
                  } catch (Throwable t) {
                      playFallbackVideo(context);
                  }
              }

              private static void playFallbackVideo(Context context) {
                  try {
                      String vid = FALLBACK_VIDEOS[fallbackIndex % FALLBACK_VIDEOS.length];
                      fallbackIndex++;
                      targetDuration = 15;
                      playVideo(context, vid);
                  } catch (Throwable ignored) {}
              }

              private static void playVideo(Context context, String vid) {
                  try {
                      currentVideoId = vid;
                      currentElapsed = 0;
                      currentRemainingSeconds = targetDuration;

                      new Handler(Looper.getMainLooper()).post(() -> {
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse("vnd.youtube:" + vid));
                              intent.setPackage(YOUTUBE_PKG);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                              context.startActivity(intent);
                          } catch (Exception e) {
                              try {
                                  Intent web = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/watch?v=" + vid));
                                  web.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  context.startActivity(web);
                              } catch (Exception ignored) {}
                          }

                          if (instance != null) {
                              instance.showBlueOverlay();
                          }
                      });
                  } catch (Throwable ignored) {}
              }

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  try {
                      windowManager = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  } catch (Exception ignored) {}
              }

              private boolean isYouTubeActive() {
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null && root.getPackageName() != null) {
                          return YOUTUBE_PKG.equals(root.getPackageName().toString());
                      }
                  } catch (Throwable ignored) {}
                  return false;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      if (!isRunning || currentVideoId.isEmpty() || event == null) return;

                      String pkg = event.getPackageName() != null ? event.getPackageName().toString() : "";
                      if (YOUTUBE_PKG.equals(pkg)) {
                          AccessibilityNodeInfo root = getRootInActiveWindow();
                          isAdDetected = checkIsAdActive(root);
                          isPaused = checkIsVideoPaused(root);

                          if (overlayView != null && overlayView.getVisibility() != View.VISIBLE) {
                              overlayView.setVisibility(View.VISIBLE);
                          }
                      } else {
                          isPaused = true;
                          if (overlayView != null) overlayView.setVisibility(View.GONE);
                      }
                  } catch (Throwable ignored) {}
              }

              private boolean checkIsAdActive(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  try {
                      CharSequence text = node.getText();
                      CharSequence desc = node.getContentDescription();
                      if (text != null) {
                          String s = text.toString().toLowerCase().trim();
                          if (s.contains("skip ad") || s.contains("skip ads") || s.startsWith("ad 1 of") || s.startsWith("ad 2 of") || s.contains("ad ·")) {
                              return true;
                          }
                      }
                      if (desc != null) {
                          String s = desc.toString().toLowerCase().trim();
                          if (s.contains("skip ad") || s.contains("skip ads") || s.startsWith("ad 1 of") || s.startsWith("ad 2 of") || s.contains("ad ·")) {
                              return true;
                          }
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (checkIsAdActive(node.getChild(i))) return true;
                      }
                  } catch (Throwable ignored) {}
                  return false;
              }

              private boolean checkIsVideoPaused(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  try {
                      CharSequence desc = node.getContentDescription();
                      if (desc != null && desc.toString().equalsIgnoreCase("play video")) {
                          return true;
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (checkIsVideoPaused(node.getChild(i))) return true;
                      }
                  } catch (Throwable ignored) {}
                  return false;
              }

              @SuppressLint("InflateParams")
              public void showBlueOverlay() {
                  if (!Settings.canDrawOverlays(this)) return;

                  new Handler(Looper.getMainLooper()).post(() -> {
                      try {
                          if (overlayView == null) {
                              int layoutType = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                                      ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                      : WindowManager.LayoutParams.TYPE_PHONE;

                              WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                                      WindowManager.LayoutParams.WRAP_CONTENT,
                                      WindowManager.LayoutParams.WRAP_CONTENT,
                                      layoutType,
                                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                                      PixelFormat.TRANSLUCENT
                              );
                              params.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                              params.y = 65;

                              overlayView = LayoutInflater.from(this).inflate(R.layout.floating_timer_overlay, null);
                              tvPillSeconds = overlayView.findViewById(R.id.tv_floating_seconds);
                              windowManager.addView(overlayView, params);
                          }

                          overlayView.setVisibility(View.VISIBLE);
                          isPaused = false;
                          isAdDetected = false;
                          startSmoothTicker();
                      } catch (Throwable ignored) {}
                  });
              }

              private void startSmoothTicker() {
                  if (tickerRunnable != null) tickerHandler.removeCallbacks(tickerRunnable);

                  tickerRunnable = new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (!isRunning) return;

                              if (!isYouTubeActive()) {
                                  if (overlayView != null) overlayView.setVisibility(View.GONE);
                                  isPaused = true;
                                  tickerHandler.postDelayed(this, 1000);
                                  return;
                              } else {
                                  if (overlayView != null && overlayView.getVisibility() != View.VISIBLE) {
                                      overlayView.setVisibility(View.VISIBLE);
                                  }
                              }

                              if (isAdDetected) {
                                  if (tvPillSeconds != null) tvPillSeconds.setText("Ad...");
                              } else if (isPaused) {
                                  if (tvPillSeconds != null) tvPillSeconds.setText(currentElapsed + " / " + targetDuration);
                              } else {
                                  currentElapsed++;
                                  currentRemainingSeconds = Math.max(0, targetDuration - currentElapsed);

                                  if (tvPillSeconds != null) {
                                      tvPillSeconds.setText(currentElapsed + " / " + targetDuration);
                                  }

                                  if (MainActivity.instance != null) {
                                      MainActivity.instance.syncWatchStateToWeb(true, currentRemainingSeconds);
                                  }

                                  if (currentElapsed >= targetDuration) {
                                      claimAndLoadNextVideo();
                                      return;
                                  }
                              }
                          } catch (Throwable ignored) {}

                          tickerHandler.postDelayed(this, 1000);
                      }
                  };
                  tickerHandler.postDelayed(tickerRunnable, 1000);
              }

              private void claimAndLoadNextVideo() {
                  if (tickerRunnable != null) tickerHandler.removeCallbacks(tickerRunnable);

                  try {
                      String cookie = CookieManager.getInstance().getCookie(BASE_URL);

                      FormBody form = new FormBody.Builder()
                              .add("user_id", String.valueOf(currentUserId))
                              .add("video_id", currentVideoId)
                              .build();

                      Request.Builder reqBuilder = new Request.Builder()
                              .url(BASE_URL + "/index.php?api=claim_reward")
                              .header("User-Agent", "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36")
                              .post(form);

                      if (cookie != null && !cookie.isEmpty()) {
                          reqBuilder.header("Cookie", cookie);
                      }

                      new OkHttpClient().newCall(reqBuilder.build()).enqueue(new Callback() {
                          @Override
                          public void onFailure(Call call, IOException e) {
                              if (isRunning) {
                                  new Handler(Looper.getMainLooper()).postDelayed(() -> fetchNextAndPlay(getApplicationContext()), 1000);
                              }
                          }

                          @Override
                          public void onResponse(Call call, Response response) {
                              try {
                                  String body = response.body() != null ? response.body().string() : "";
                                  JSONObject json = new JSONObject(body);

                                  if (json.optBoolean("success") || "success".equals(json.optString("status"))) {
                                      new Handler(Looper.getMainLooper()).post(() -> {
                                          Toast.makeText(getApplicationContext(), "🎉 Task completed! Reward added: $0.0004", Toast.LENGTH_SHORT).show();
                                      });
                                      if (tvPillSeconds != null) {
                                          tvPillSeconds.setText("🎉 +$0.0004 Added!");
                                      }
                                  }
                              } catch (Exception ignored) {}

                              if (isRunning) {
                                  new Handler(Looper.getMainLooper()).postDelayed(() -> fetchNextAndPlay(getApplicationContext()), 1200);
                              }
                          }
                      });
                  } catch (Throwable t) {
                      if (isRunning) {
                          new Handler(Looper.getMainLooper()).postDelayed(() -> fetchNextAndPlay(getApplicationContext()), 1200);
                      }
                  }
              }

              public void stopWatcher() {
                  try {
                      if (tickerRunnable != null) tickerHandler.removeCallbacks(tickerRunnable);

                      String cookie = CookieManager.getInstance().getCookie(BASE_URL);
                      FormBody form = new FormBody.Builder().add("user_id", String.valueOf(currentUserId)).build();
                      Request.Builder reqBuilder = new Request.Builder()
                              .url(BASE_URL + "/index.php?api=stop_watching")
                              .header("User-Agent", "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36")
                              .post(form);

                      if (cookie != null && !cookie.isEmpty()) {
                          reqBuilder.header("Cookie", cookie);
                      }

                      new OkHttpClient().newCall(reqBuilder.build()).enqueue(new Callback() {
                          @Override
                          public void onFailure(Call call, IOException e) {}
                          @Override
                          public void onResponse(Call call, Response response) {}
                      });

                      if (MainActivity.instance != null) {
                          MainActivity.instance.syncWatchStateToWeb(false, 0);
                      }

                      new Handler(Looper.getMainLooper()).post(() -> {
                          try {
                              if (overlayView != null && windowManager != null) {
                                  windowManager.removeView(overlayView);
                                  overlayView = null;
                              }
                          } catch (Exception ignored) {}
                      });
                  } catch (Throwable ignored) {}
              }

              @Override
              public void onInterrupt() {}

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  stopWatcher();
                  instance = null;
              }
          }
